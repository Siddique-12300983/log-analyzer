[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "log-analyzer"
version = "1.0.0"
description = "Flag suspicious authentication activity in Linux and Windows logs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Md Abu Bakar Siddique" }]

[project.scripts]
log-analyzer = "loganalyzer.cli:main"

[tool.setuptools.packages.find]
include = ["loganalyzer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
